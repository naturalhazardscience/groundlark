syntax = "proto3";

package groundlark.sensor.v1;

// Wire layout only. docs/sensor-contract.md owns units, bounds and semantics.
message Envelope {
  uint32 version = 1;
  string device_id = 2;
  fixed64 boot_id = 3;
  oneof body {
    Identity identity = 10;
    Configuration configuration = 11;
    SampleBatch batch = 12;
    DeviceStatus status = 13;
  }
}

enum Board {
  BOARD_UNSPECIFIED = 0;
  BOARD_DAQHAT_01 = 1;
  BOARD_USB_HEAD = 2;
  BOARD_SKYLARK_USB = 3;
}

enum SensorId {
  SENSOR_ID_UNSPECIFIED = 0;
  SENSOR_ID_IMU_1 = 1;
  SENSOR_ID_IMU_2 = 2;
  SENSOR_ID_IMU_3 = 3;
  SENSOR_ID_IMU_4 = 4;
  SENSOR_ID_INCLINOMETER = 5;
  SENSOR_ID_GNSS = 6;
  SENSOR_ID_MAGNETOMETER = 7;
  SENSOR_ID_PRESSURE = 8;
  SENSOR_ID_GEOPHONE = 9;
  SENSOR_ID_SO2_WORKING = 10;
  SENSOR_ID_SO2_AUXILIARY = 11;
  SENSOR_ID_H2S_WORKING = 12;
  SENSOR_ID_H2S_AUXILIARY = 13;
  SENSOR_ID_PARTICULATE = 14;
  SENSOR_ID_AMBIENT_CLIMATE = 15;
  SENSOR_ID_BAROMETER = 16;
  SENSOR_ID_ENCLOSURE_CLIMATE = 17;
  SENSOR_ID_MAGNETOMETER_2 = 18;
  SENSOR_ID_MAGNETOMETER_3 = 19;
  SENSOR_ID_MAGNETOMETER_4 = 20;
}

enum ClockDomain {
  CLOCK_DOMAIN_UNSPECIFIED = 0;
  CLOCK_DOMAIN_PI_MONOTONIC_RAW = 1;
  CLOCK_DOMAIN_MCU_MONOTONIC = 2;
}

enum Quality {
  QUALITY_UNSPECIFIED = 0;
  QUALITY_VALID = 1;
  QUALITY_MISSING = 2;
  QUALITY_SATURATED = 3;
  QUALITY_FAULT = 4;
}

enum StatusCode {
  STATUS_CODE_UNSPECIFIED = 0;
  STATUS_CODE_READY = 1;
  STATUS_CODE_DISCONNECTED = 2;
  STATUS_CODE_IO_ERROR = 3;
  STATUS_CODE_BUFFER_OVERFLOW = 4;
  STATUS_CODE_BAD_CONFIGURATION = 5;
  STATUS_CODE_RESET = 6;
}

message Identity {
  Board board = 1;
  string firmware_version = 2;
  repeated SensorId sensors = 3;
}

// Effective configuration advertisement; not an unacknowledged command.
message Configuration {
  uint32 revision = 1;
  repeated SensorConfiguration sensors = 2;
}

message SensorConfiguration {
  SensorId sensor_id = 1;
  bool enabled = 2;
  uint64 period_ns = 3;
  // Optional sorted 8-bit address/value pairs for LSM6DSO/RM3100 only.
  bytes register_config = 4;
  optional uint32 tilt_mode = 5;
  optional uint32 acceleration_range_g = 6;
  optional uint32 angular_rate_range_dps = 7;
  optional uint32 cycle_count_x = 8;
  optional uint32 cycle_count_y = 9;
  optional uint32 cycle_count_z = 10;
  optional double pressure_min_pa = 11;
  optional double pressure_max_pa = 12;
  string pressure_part_number = 13;
  optional uint32 geophone_gain = 14;
  optional double geophone_reference_v = 15;
  // SDP3x continuous command actually acknowledged; absent in older recordings.
  optional uint32 pressure_measurement_command = 16;
}

message Timestamp {
  ClockDomain domain = 1;
  optional uint64 acquisition_ns = 2;
  // Absent means unknown, including when acquisition is estimated from polling.
  optional uint64 uncertainty_ns = 3;
  // Optional correlated UTC estimate, never a replacement for acquisition_ns.
  optional int64 utc_unix_ns = 4;
  optional uint64 utc_uncertainty_ns = 5;
}

message Vector3i {
  optional sint32 x = 1;
  optional sint32 y = 2;
  optional sint32 z = 3;
}

message Vector3d {
  optional double x = 1;
  optional double y = 2;
  optional double z = 3;
}

message ImuRaw {
  Vector3i acceleration = 1;
  Vector3i angular_rate = 2;
  optional sint32 temperature = 3;
}

message TiltRaw {
  Vector3i acceleration = 1;
  Vector3i angle = 2;
  optional sint32 temperature = 3;
  optional uint32 device_status = 4;
}

message MagneticRaw {
  Vector3i counts = 1;
}

// Burrowlark B1 common POLL command and individual DRDY interrupt observations.
// Same MCU clock as Timestamp; these do not establish physical sample times.
message MagneticTiming {
  optional uint64 cohort = 1;
  optional uint64 trigger_ns = 2;
  optional uint64 ready_observed_ns = 3;
}

message PressureRaw {
  // Legacy DLVR: exactly four bytes including status and temperature bits.
  bytes response = 1;
  // SDP32: exactly nine bytes, pressure/temperature/scale words and their CRCs.
  // Exactly one response format must be populated. Signed counts are retained.
  bytes sdp3x_response = 2;
  // Host-observed bounds between consecutive pressure read transactions.
  // These bound the read/reset interval, not physical conversion/filter delay.
  // Absent means unknown. Both fields must be present together.
  optional uint64 read_interval_min_ns = 3;
  optional uint64 read_interval_max_ns = 4;
}

message GnssRaw {
  // Exactly the 92-byte UBX NAV-PVT payload; validated UBX checksum upstream.
  bytes nav_pvt = 1;
}

message GeophoneRaw {
  optional sint32 counts = 1;
  optional uint32 conversion_counter = 2;
}

message GasRaw {
  optional sint32 counts = 1;
  optional uint32 conversion_counter = 2;
}

message ParticulateRaw {
  // Complete 32-byte PMS5003 frame, including header and checksum.
  bytes response = 1;
}

message ClimateRaw {
  // SHT40 (sensor 15) or SHT45 (sensor 17): temperature/humidity words and CRCs.
  bytes response = 1;
}

message BarometerRaw {
  // Bosch BMP3 (BMP388/BMP390) pressure then temperature registers, little-endian uint24.
  bytes response = 1;
  // Unmodified factory trim registers 0x31..0x45.
  bytes calibration = 2;
}

message Calibrated {
  Vector3d acceleration_m_s2 = 1;
  Vector3d angular_rate_rad_s = 2;
  Vector3d angle_rad = 3;
  Vector3d magnetic_t = 4;
  optional double pressure_pa = 5;
  optional double temperature_k = 6;
  // Measured DC transfer from J90 differential volts to ADC counts.
  // Electrical calibration only; not ground velocity or inverse response.
  optional double geophone_input_v = 7;
}

message Sample {
  optional uint64 sequence = 1;
  Timestamp time = 2;
  Quality quality = 3;
  oneof raw {
    ImuRaw imu = 10;
    TiltRaw tilt = 11;
    MagneticRaw magnetic = 12;
    PressureRaw pressure = 13;
    GnssRaw gnss = 14;
    GeophoneRaw geophone = 15;
    GasRaw gas = 16;
    ParticulateRaw particulate = 17;
    ClimateRaw climate = 18;
    BarometerRaw barometer = 19;
  }
  Calibrated calibrated = 20;
  MagneticTiming magnetic_timing = 21;
}

message SampleBatch {
  SensorId sensor_id = 1;
  uint32 configuration_revision = 2;
  repeated Sample samples = 3;
  optional uint64 dropped_before = 4;
  string calibration_id = 5;
}

message DeviceStatus {
  // Zero identifies the whole producer, rather than a particular sensor.
  SensorId sensor_id = 1;
  StatusCode code = 2;
  optional uint64 dropped_total = 3;
  string detail = 4;
}
